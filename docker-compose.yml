services:
  backend:
    build:
      context: ./backend
    container_name: shcom-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  payment-service:
    build:
      context: ./payment-service
    container_name: shcom-payment-service
    restart: unless-stopped
    env_file:
      - ./payment-service/.env
    environment:
      PORT: "5001"
    ports:
      - "5001:5001"
    volumes:
      - payment-ledger:/app/data

volumes:
  payment-ledger:
